name: Päivitä kojelauta

on:
  schedule:
    - cron: "*/10 * * * *"   # 10 min välein (GitHub voi viivästää ajoa ruuhkassa)
  push:
    branches: [main]
  workflow_dispatch:          # käsin: Actions → Päivitä kojelauta → Run workflow

permissions:
  contents: write             # vain kuukausittaista "hereilläolo"-committia varten
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae uutiset, sähkön hinta ja sää
        run: |
          mkdir -p _site
          cp index.html _site/
          python build.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pysäyttää ajastetut työt, jos repossa ei ole tapahtunut mitään 60 päivään.
      # Tehdään tyhjä commit, kun edellisestä on yli 45 päivää.
      - name: Pidä ajastus hengissä
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Ajastuksen ylläpito [skip ci]"
            git push
          fi
