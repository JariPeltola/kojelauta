<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kojelauta</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --grid: #eef0f3; --link: #1d4ed8;
    --yle: #00a0b4; --il: #d6001c; --is: #e0a100; --vu: #0b3d91;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           padding: 14px 20px 6px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; }
  #clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: 60% 1fr; gap: 16px;
         padding: 8px 20px 20px; height: calc(100vh - 52px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 12px 16px; min-height: 0; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; display: flex;
             justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  #news { display: flex; flex-direction: column; }
  #news ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #news li { display: flex; gap: 10px; align-items: baseline; padding: 6px 2px;
             border-bottom: 1px solid var(--line); }
  #news time { color: var(--muted); font-size: 12px; min-width: 38px;
               font-variant-numeric: tabular-nums; }
  #news .src { font-size: 11px; font-weight: 600; color: #fff; border-radius: 4px;
               padding: 1px 5px; min-width: 28px; text-align: center; flex-shrink: 0; }
  #news a { color: var(--link); text-decoration: none; }
  #news a:hover { text-decoration: underline; }
  #news a:visited { color: #6d28d9; }
  #news li.day { color: var(--muted); font-size: 12px; font-weight: 600;
                 padding: 12px 2px 4px; text-transform: capitalize; }
  .charts { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 12px; min-height: 0; }
  .charts .card { display: flex; flex-direction: column; }
  .chart-box { position: relative; flex: 1; min-height: 130px; }
  .chart-box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart-box text { font: 11px system-ui, sans-serif; fill: var(--muted); }
  .tip { position: absolute; pointer-events: none; background: #1f2937; color: #fff;
         font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap;
         transform: translate(-50%, -110%); display: none; z-index: 2; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
              margin-right: 5px; vertical-align: -1px; }
  .err { color: #b91c1c; font-size: 12px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .charts { grid-template-rows: auto auto auto; }
    .chart-box { min-height: 240px; }
    #news ul { max-height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Kojelauta</h1>
  <span id="clock"></span>
</header>
<main>
  <section class="card" id="news">
    <h2>Uutiset <small id="news-updated"></small></h2>
    <div class="err" id="news-err"></div>
    <ul id="news-list"></ul>
  </section>
  <div class="charts">
    <section class="card">
      <h2>Pörssisähkö, Suomi <small id="price-info">c/kWh, sis. alv 25,5 %</small></h2>
      <div class="err" id="price-err"></div>
      <div class="chart-box" id="price-box"><div class="tip"></div></div>
      <div class="legend">
        <span><i style="background:#22c55e"></i>&lt; 5 c</span>
        <span><i style="background:#84cc16"></i>5–10 c</span>
        <span><i style="background:#f59e0b"></i>10–20 c</span>
        <span><i style="background:#ef4444"></i>&gt; 20 c</span>
        <span><i style="background:#1d4ed8"></i>nyt</span>
      </div>
    </section>
    <section class="card">
      <h2>Sää, Lahti <small id="weather-info">seuraavat 24 h</small></h2>
      <div class="err" id="weather-err"></div>
      <div class="chart-box" id="weather-box"><div class="tip"></div></div>
      <div class="legend">
        <span><i style="background:#ef4444"></i>Lämpötila (°C)</span>
        <span><i style="background:rgba(37,99,235,.55)"></i>Sade (mm/h)</span>
      </div>
    </section>
    <section class="card">
      <h2>Rahastot, 12 kk <small id="funds-info">arvonmuutos, %</small></h2>
      <div class="err" id="funds-err"></div>
      <div class="chart-box" id="funds-box"><div class="tip"></div></div>
      <div class="legend" id="funds-legend"></div>
    </section>
  </div>
</main>

<script>
const REFRESH_MS = 10 * 60 * 1000;          // päivitys 10 minuutin välein
const SRC = {
  "Yle": ["Yle", "var(--yle)"],
  "Iltalehti": ["IL", "var(--il)"],
  "Ilta-Sanomat": ["IS", "var(--is)"],
  "Verkkouutiset": ["VU", "var(--vu)"],
};
const fmtTime = d => d.toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" });
const fmtDay = d => d.toLocaleDateString("fi-FI", { weekday: "long", day: "numeric", month: "numeric" });
const fmtNum = (v, n = 2) => v.toFixed(n).replace(".", ",");
const fmtTick = v => String(+v.toFixed(2)).replace(".", ",");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Uutiset ja sähkön hinnat: GitHub Actions hakee ne 10 min välein tiedostoihin data/*.json
async function getData(name) {
  const r = await fetch(`data/${name}.json?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

// Sää haetaan suoraan Open-Meteosta (sallii selainhaun); varalla Actionsin tallentama kopio
const LAHTI = { lat: 60.9827, lon: 25.6615 };
async function getWeather() {
  try {
    const url = "https://api.open-meteo.com/v1/forecast" +
      `?latitude=${LAHTI.lat}&longitude=${LAHTI.lon}` +
      "&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m" +
      "&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_hours=25";
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.statusText);
    const h = (await r.json()).hourly;
    return { times: h.time, temp: h.temperature_2m, precip: h.precipitation,
             code: h.weather_code, wind: h.wind_speed_10m };
  } catch (e) {
    return getData("weather");
  }
}

// ---------- pieni SVG-graafikirjasto ----------
function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return ticks;
}

/**
 * spec: { n, labelAt(i)->string|null, tip(i)->html,
 *         bars: {values, color(i), axis}, line: {values, color, axis},
 *         axes: {left:{ticks,unit}, right:{ticks,unit}}, marker: index|null, icons(i)->str|null }
 */
function drawChart(box, spec) {
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const padL = 38, padR = spec.axes.right ? 36 : 10, padT = spec.icons ? 24 : 16, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const slot = iw / spec.n;
  const X = i => padL + i * slot;
  const scale = ax => { const t = ax.ticks, lo = t[0], hi = t[t.length - 1];
                        return v => padT + ih - (v - lo) / (hi - lo) * ih; };
  const yL = scale(spec.axes.left), yR = spec.axes.right ? scale(spec.axes.right) : null;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;

  // vaakaviivat + vasen akseli
  for (const t of spec.axes.left.ticks) {
    const y = yL(t);
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${t === 0 ? '#cbd0d8' : 'var(--grid)'}"/>`;
    s += `<text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmtTick(t)}</text>`;
  }
  s += `<text x="${padL - 6}" y="${padT - 8}" text-anchor="end">${spec.axes.left.unit}</text>`;
  if (spec.axes.right) {
    for (const t of spec.axes.right.ticks)
      s += `<text x="${W - padR + 6}" y="${yR(t) + 4}">${fmtTick(t)}</text>`;
    s += `<text x="${W - padR + 6}" y="${padT - 8}">${spec.axes.right.unit}</text>`;
  }

  // pylväät
  if (spec.bars) {
    const y = spec.bars.axis === "right" ? yR : yL;
    const y0 = y(Math.max(0, (spec.bars.axis === "right" ? spec.axes.right : spec.axes.left).ticks[0]));
    const gap = slot > 6 ? 1 : slot > 3 ? 0.5 : 0;
    spec.bars.values.forEach((v, i) => {
      if (v == null) return;
      const yv = y(v), top = Math.min(yv, y0), h = Math.max(Math.abs(y0 - yv), v ? 1 : 0);
      s += `<rect x="${X(i) + gap / 2}" y="${top}" width="${Math.max(slot - gap, 0.5)}" height="${h}" fill="${spec.bars.color(i)}"/>`;
    });
  }

  // viiva
  for (const ln of (spec.lines || (spec.line ? [spec.line] : []))) {
    const y = ln.axis === "right" ? yR : yL;
    const pts = ln.values.map((v, i) => v == null ? null : `${X(i) + slot / 2},${y(v)}`).filter(Boolean).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="${ln.color}" stroke-width="${ln.width || 2.2}" stroke-linejoin="round"/>`;
  }

  // nykyhetken merkki
  if (spec.marker != null && spec.marker >= 0) {
    const x = X(spec.marker) + slot / 2;
    s += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${padT + ih}" stroke="#1d4ed8" stroke-dasharray="3 3"/>`;
  }

  // x-akselin nimiöt ja ikonit
  for (let i = 0; i < spec.n; i++) {
    const lab = spec.labelAt(i);
    if (lab) {
      s += `<line x1="${X(i)}" x2="${X(i)}" y1="${padT + ih}" y2="${padT + ih + 4}" stroke="#cbd0d8"/>`;
      s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
    }
    const ic = spec.icons && spec.icons(i);
    if (ic) s += `<text x="${X(i) + slot / 2}" y="${padT - 6}" text-anchor="middle" style="font-size:14px">${ic}</text>`;
  }
  s += `<line class="hover" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="#9ca3af" visibility="hidden"/>`;
  s += `<rect class="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;

  const tip = box.querySelector(".tip");
  box.querySelector("svg")?.remove();
  box.insertAdjacentHTML("beforeend", s);
  const svg = box.querySelector("svg"), hl = svg.querySelector(".hover");
  const hit = svg.querySelector(".hit");
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.min(spec.n - 1, Math.max(0, Math.floor((ev.clientX - r.left - padL) / slot)));
    const x = X(i) + slot / 2;
    hl.setAttribute("x1", x); hl.setAttribute("x2", x); hl.setAttribute("visibility", "visible");
    tip.innerHTML = spec.tip(i); tip.style.display = "block";
    tip.style.left = Math.min(Math.max(x, 70), W - 70) + "px"; tip.style.top = padT + 4 + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; hl.setAttribute("visibility", "hidden"); });
}

// ---------- uutiset ----------
async function loadNews() {
  const err = document.getElementById("news-err");
  try {
    const data = await getData("news");
    let lastDay = new Date().toDateString(), html = "";
    for (const it of data.items) {
      const d = new Date(it.ts * 1000);
      if (it.ts && d.toDateString() !== lastDay) {
        lastDay = d.toDateString();
        html += `<li class="day">${fmtDay(d)}</li>`;
      }
      const [abbr, color] = SRC[it.source] || [it.source, "#888"];
      html += `<li><time>${it.ts ? fmtTime(d) : ""}</time>` +
              `<span class="src" style="background:${color}" title="${esc(it.source)}">${abbr}</span>` +
              `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a></li>`;
    }
    document.getElementById("news-list").innerHTML = html;
    err.textContent = data.errors.length ? "Ei saatu: " + data.errors.join(" · ") : "";
    const gen = new Date(data.generated);
    const age = (Date.now() - gen) / 60000;
    const upd = document.getElementById("news-updated");
    upd.textContent = "haettu " + fmtTime(gen);
    upd.style.color = age > 45 ? "#b91c1c" : "";
    upd.title = age > 45 ? "GitHubin ajastettu päivitys on myöhässä" : "";
  } catch (e) { err.textContent = "Uutisten haku epäonnistui: " + e.message; }
}

// ---------- pörssisähkö ----------
const priceColor = p => p < 5 ? "#22c55e" : p < 10 ? "#84cc16" : p < 20 ? "#f59e0b" : "#ef4444";
let priceData = null;
function renderPrice() {
  if (!priceData) return;
  const pts = priceData.points, now = Date.now();
  const starts = pts.map(p => new Date(p.start));
  const cur = pts.findIndex((p, i) => now >= starts[i] && now < +starts[i] + p.minutes * 60000);
  const vals = pts.map(p => p.price);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const hoursPerTick = pts.length > 60 ? 3 : 2;
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const nowTxt = cur >= 0 ? `nyt <b style="color:#1d4ed8">${fmtNum(vals[cur])} c/kWh</b> · ` : "";
  document.getElementById("price-info").innerHTML =
    `${nowTxt}ka. ${fmtNum(avg)} · sis. alv ${fmtNum(priceData.vat * 100, 1)} %`;
  drawChart(document.getElementById("price-box"), {
    n: pts.length,
    axes: { left: { ticks: niceTicks(lo, hi), unit: "c/kWh" } },
    bars: { values: vals, color: i => i === cur ? "#1d4ed8" : priceColor(vals[i]) },
    marker: cur,
    labelAt: i => {
      const d = starts[i];
      if (d.getMinutes() !== 0 || d.getHours() % hoursPerTick) return null;
      return d.getHours() === 0 ? d.toLocaleDateString("fi-FI", { weekday: "short" }) : String(d.getHours());
    },
    tip: i => {
      const end = new Date(+starts[i] + pts[i].minutes * 60000);
      return `${fmtDay(starts[i]).split(" ")[0]} ${fmtTime(starts[i])}–${fmtTime(end)}<br><b>${fmtNum(vals[i])} c/kWh</b>`;
    },
  });
}
async function loadPrice() {
  const err = document.getElementById("price-err");
  try {
    const data = await getData("price");
    if (!data.points.length) throw new Error("ei hintatietoja");
    priceData = data; renderPrice();
    err.textContent = data.errors.length ? "Osa hinnoista puuttuu: " + data.errors.join(" · ") : "";
  } catch (e) { err.textContent = "Sähkön hinnan haku epäonnistui: " + e.message; }
}

// ---------- sää ----------
const WMO = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️"
  : c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 77 ? "🌨️" : c <= 82 ? "🌧️" : c <= 86 ? "🌨️" : "⛈️";
let weatherData = null;
function renderWeather() {
  const w = weatherData; if (!w) return;
  const times = w.times.map(t => new Date(t));
  const tLo = Math.min(...w.temp), tHi = Math.max(...w.temp);
  const tTicks = niceTicks(Math.floor(tLo - 1), Math.ceil(tHi + 1), 4);
  const pMax = Math.max(1, ...w.precip);
  // sadeasteikko samaan määrään jakoja kuin lämpötila, jotta viivat osuvat kohdalleen
  const pStep = niceTicks(0, pMax, tTicks.length - 1)[1];
  const pAligned = tTicks.map((_, k) => +(k * pStep).toFixed(2));
  document.getElementById("weather-info").textContent =
    `nyt ${WMO(w.code[0])} ${fmtNum(w.temp[0], 1)} °C · tuuli ${fmtNum(w.wind[0], 0)} m/s`;
  drawChart(document.getElementById("weather-box"), {
    n: times.length,
    axes: { left: { ticks: tTicks, unit: "°C" }, right: { ticks: pAligned, unit: "mm" } },
    bars: { values: w.precip, axis: "right", color: () => "rgba(37,99,235,.55)" },
    line: { values: w.temp, color: "#ef4444" },
    labelAt: i => times[i].getHours() % 3 === 0 ? String(times[i].getHours()) : null,
    icons: i => times[i].getHours() % 3 === 0 ? WMO(w.code[i]) : null,
    tip: i => `${fmtDay(times[i]).split(" ")[0]} klo ${fmtTime(times[i])} ${WMO(w.code[i])}<br>` +
              `<b>${fmtNum(w.temp[i], 1)} °C</b> · sade ${fmtNum(w.precip[i], 1)} mm · tuuli ${fmtNum(w.wind[i], 1)} m/s`,
  });
}
async function loadWeather() {
  const err = document.getElementById("weather-err");
  try {
    weatherData = await getWeather(); renderWeather();
    err.textContent = "";
  } catch (e) { err.textContent = "Säätietojen haku epäonnistui: " + e.message; }
}

// ---------- rahastot ----------
const FUND_COLORS = ["#2563eb", "#16a34a", "#d97706"];
const shortName = n => n.replace(/^OP-/, "").replace(/ Indeksi A$/, "");
const fmtPct = v => (v > 0 ? "+" : v < 0 ? "−" : "") + fmtNum(Math.abs(v), 1) + " %";
const FUNDS = [
  ["OP-Eurooppa Indeksi A", "0P0000UP8X"],
  ["OP-Pohjoismaat Indeksi A", "0P0000UBBU"],
  ["OP-Suomi Indeksi A", "0P0001DHRI"],
];
// Rahastojen arvot haetaan suoraan Morningstarista; varalla GitHubin tallentama kopio
async function getFunds() {
  try {
    const start = new Date(Date.now() - 366 * 864e5).toISOString().slice(0, 10);
    const funds = await Promise.all(FUNDS.map(async ([name, id]) => {
      const url = "https://lt.morningstar.com/api/rest.svc/timeseries_price/9vehuxllxs" +
        `?id=${encodeURIComponent(id + "]2]0]FOFIN$$ALL")}&currencyId=EUR&idtype=Morningstar` +
        `&frequency=daily&startDate=${start}&outputType=COMPACTJSON`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(r.statusText);
      const rows = (await r.json()).filter(x => x[1] != null);
      if (!rows.length) throw new Error("tyhjä vastaus");
      return { name, symbol: id, dates: rows.map(x => new Date(x[0]).toISOString().slice(0, 10)),
               values: rows.map(x => x[1]) };
    }));
    return { funds, errors: [] };
  } catch (e) {
    return getData("funds");
  }
}
let fundsData = null;
function renderFunds() {
  const f = fundsData; if (!f || !f.funds.length) return;
  // yhteinen päivämääräakseli; puuttuvat päivät täytetään edellisellä arvolla
  const dates = [...new Set(f.funds.flatMap(x => x.dates))].sort();
  const series = f.funds.map(x => {
    const m = new Map(x.dates.map((d, i) => [d, x.values[i]]));
    let last = null;
    const vals = dates.map(d => (m.has(d) ? (last = m.get(d)) : last));
    const base = vals.find(v => v != null);
    return { name: shortName(x.name), vals, pct: vals.map(v => v == null ? null : (v / base - 1) * 100) };
  });
  const all = series.flatMap(s => s.pct).filter(v => v != null);
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all), 4);
  const dts = dates.map(d => new Date(d + "T12:00:00"));
  document.getElementById("funds-legend").innerHTML = series.map((s, k) =>
    `<span><i style="background:${FUND_COLORS[k]}"></i>${esc(s.name)} <b style="color:var(--text)">${fmtPct(s.pct.at(-1))}</b></span>`).join("");
  document.getElementById("funds-info").textContent =
    `${dts[0].toLocaleDateString("fi-FI")} – ${dts.at(-1).toLocaleDateString("fi-FI")}`;
  const monthStep = document.getElementById("funds-box").clientWidth < 600 ? 2 : 1;
  drawChart(document.getElementById("funds-box"), {
    n: dates.length,
    axes: { left: { ticks, unit: "%" } },
    lines: series.map((s, k) => ({ values: s.pct, color: FUND_COLORS[k], width: 1.8 })),
    labelAt: i => {
      if (i === 0 || dts[i].getMonth() === dts[i - 1].getMonth()) return null;
      if (dts[i].getMonth() % monthStep) return null;
      return dts[i].getMonth() === 0 ? String(dts[i].getFullYear())
                                     : dts[i].toLocaleDateString("fi-FI", { month: "short" }).replace(".", "");
    },
    tip: i => `${dts[i].toLocaleDateString("fi-FI")}<br>` + series.map((s, k) =>
      `<span style="color:${FUND_COLORS[k]}">●</span> ${esc(s.name)}: <b>${fmtPct(s.pct[i])}</b> (${fmtNum(s.vals[i])} €)`).join("<br>"),
  });
}
async function loadFunds() {
  const err = document.getElementById("funds-err");
  try {
    fundsData = await getFunds(); renderFunds();
    err.textContent = fundsData.errors.length ? "Ei saatu: " + fundsData.errors.join(" · ") : "";
  } catch (e) { err.textContent = "Rahastotietojen haku epäonnistui: " + e.message; }
}

// ---------- ajastus ----------
function tick() {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("fi-FI", { weekday: "long", day: "numeric", month: "numeric",
                                          hour: "2-digit", minute: "2-digit" });
}
function refreshAll() { loadNews(); loadPrice(); loadWeather(); loadFunds(); }

new ResizeObserver(() => { renderPrice(); renderWeather(); renderFunds(); })
  .observe(document.querySelector(".charts"));
tick(); setInterval(tick, 15000);
setInterval(renderPrice, 60000);   // "nyt"-merkki liikkuu minuutin välein
refreshAll(); setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
